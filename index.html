<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Spoon 金湯匙</title>

<meta name="description" content="The Golden Spoon 金湯匙 Halal Restaurant — authentic Pakistani &amp; Indian halal cuisine in Minxiong, Chiayi County, Taiwan. 嘉義民雄清真餐廳，正宗巴基斯坦及印度風味。">
<meta property="og:title" content="The Golden Spoon 金湯匙 Halal Restaurant">
<meta property="og:description" content="Authentic Pakistani &amp; Indian halal cuisine in Minxiong, Chiayi. 正宗巴基斯坦及印度風味清真餐廳 · 嘉義民雄。Tue–Sun 4–11 PM.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap">

<style>
/* ============================================================
   THE GOLDEN SPOON 金湯匙 — design tokens
   Layout concept: cinematic editorial bands — deep forest green
   alternating with warm ivory; photography-led frames; restrained
   antique-gold accents; asymmetric grids on desktop.
   ============================================================ */
:root{
  --green:#A3480F;          /* burnt orange — primary dark band */
  --green-2:#B4581D;        /* raised orange surface */
  --green-3:#351A08;        /* deep umber, hero base */
  --ink:#241711;            /* warm charcoal text on light */
  --gold:#C05F14;           /* saffron orange accent */
  --gold-soft:#F2B27C;      /* light apricot for text on dark */
  --ivory:#FFFDFA;          /* near-white warm ground */
  --cream:#FBF0E3;          /* soft cream surface */
  --olive:#8A7260;          /* warm taupe, secondary text on light */
  --mist:#E6C6A8;           /* pale apricot, secondary text on dark */
  --line-dark:rgba(242,178,124,.3);
  --line-light:rgba(36,23,17,.14);
  --serif:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --serif-tc:"Noto Serif TC","Cormorant Garamond",Georgia,serif;
  --sans:"Inter","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  --sans-tc:"Noto Sans TC","Inter",-apple-system,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --wrap:1200px;
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--ivory);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.65;
  overflow-x:hidden;
}
html[lang="zh-Hant"] body{font-family:var(--sans-tc);letter-spacing:.015em}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
::selection{background:var(--gold);color:var(--green-3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}

.wrap{max-width:var(--wrap);margin:0 auto;
  padding-left:var(--gutter);padding-right:var(--gutter-r)}

/* ---------- type ---------- */
.display{font-family:var(--serif);font-weight:600;line-height:1.08;text-wrap:balance}
html[lang="zh-Hant"] .display{font-family:var(--serif-tc);font-weight:700;line-height:1.22;letter-spacing:.03em}
.eyebrow{font-family:var(--sans);font-size:.72rem;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
html[lang="zh-Hant"] .eyebrow{letter-spacing:.42em;font-family:var(--sans-tc)}
.lede{font-size:1.06rem;max-width:34em}
.gold-rule{width:52px;height:1px;background:var(--gold);border:0;margin:1.1rem 0}

/* ---------- reveal motion (JS adds .pre only to below-fold items) ---------- */
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.pre{opacity:0;transform:translateY(26px)}
.rv.in{opacity:1;transform:none}
.mask{overflow:hidden}
.mask>.mask-in{transition:transform 1s var(--ease)}
.mask.pre>.mask-in{transform:translateY(110%)}
.mask.in>.mask-in{transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.rv.pre,.mask>.mask-in,.mask.pre>.mask-in{opacity:1!important;transform:none!important;transition:none!important}
  .hero-bg,.hero-img,.plate-art::after{animation:none!important}
  .plate .curtain{display:none!important}
  .plate.irv-pre img{transform:none!important}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ---------- announcement ---------- */
.annc{background:var(--green-3);color:var(--gold-soft);font-size:.8rem;
  position:relative;z-index:60}
.annc-in{display:flex;align-items:center;justify-content:center;gap:.8rem;
  padding:.5rem var(--gutter-r) .5rem var(--gutter);text-align:center}
.annc button{color:var(--gold-soft);opacity:.7;font-size:1rem;line-height:1;padding:.2rem .4rem}
.annc button:hover{opacity:1}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;z-index:50;top:env(safe-area-inset-top,0px);
  transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  max-width:var(--wrap);margin:0 auto;
  padding:.9rem var(--gutter-r) .9rem var(--gutter)}
.nav.solid{background:rgba(53,26,8,.92);backdrop-filter:blur(14px);
  box-shadow:0 1px 0 var(--line-dark)}
.brand{display:flex;align-items:center;gap:.7rem;color:var(--ivory)}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--serif);font-weight:600;font-size:1.06rem;letter-spacing:.04em;line-height:1.1}
.brand-zh{font-family:var(--serif-tc);font-size:.78rem;color:var(--gold-soft);letter-spacing:.3em;display:block}
.nav-links{display:flex;gap:1.9rem;align-items:center}
.nav-links a{color:rgba(247,243,234,.85);font-size:.84rem;font-weight:500;
  letter-spacing:.09em;position:relative;padding:.3rem 0}
html[lang="zh-Hant"] .nav-links a{letter-spacing:.18em}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;
  background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav-links a:hover{color:var(--ivory)}
.nav-links a:hover::after{transform:scaleX(1);transform-origin:left}
.nav-right{display:flex;align-items:center;gap:.9rem}
.lang-sw{display:flex;align-items:center;border:1px solid var(--line-dark);border-radius:2px;overflow:hidden}
.lang-sw button{padding:.42rem .7rem;font-size:.74rem;font-weight:600;letter-spacing:.06em;
  color:rgba(247,243,234,.75);transition:background .3s,color .3s}
.lang-sw button[aria-pressed="true"]{background:var(--gold);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.7rem;font-size:.83rem;font-weight:600;letter-spacing:.12em;
  border:1px solid var(--gold);border-radius:2px;transition:background .35s,color .35s,transform .35s}
html[lang="zh-Hant"] .btn{letter-spacing:.22em}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-soft);color:var(--green-3);transform:translateY(-2px)}
.btn-ghost{color:var(--ivory)}
.btn-ghost:hover{background:rgba(242,178,124,.14);transform:translateY(-2px)}
.btn-dark{color:var(--green);border-color:var(--green)}
.btn-dark:hover{background:var(--green);color:var(--ivory);transform:translateY(-2px)}
.nav-cta{padding:.55rem 1.1rem}
.burger{display:none;width:44px;height:44px;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.burger span{display:block;width:22px;height:1.6px;background:var(--ivory);transition:transform .35s,opacity .35s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6.6px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6.6px) rotate(-45deg)}

/* mobile panel */
.mnav{position:fixed;inset:0;z-index:49;background:var(--green-3);
  display:flex;flex-direction:column;justify-content:center;
  padding:5rem var(--gutter-r) 3rem var(--gutter);
  opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
.mnav.open{opacity:1;visibility:visible}
.mnav a{display:block;color:var(--ivory);font-family:var(--serif);font-size:2rem;
  padding:.65rem 0;border-bottom:1px solid rgba(242,178,124,.14);
  transform:translateY(14px);opacity:0;transition:transform .5s var(--ease),opacity .5s}
html[lang="zh-Hant"] .mnav a{font-family:var(--serif-tc);letter-spacing:.14em;font-size:1.7rem}
.mnav.open a{transform:none;opacity:1}
.mnav a small{display:block;font-family:var(--sans);font-size:.68rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:.1rem}
.mnav-actions{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--green-3);color:var(--ivory);
  min-height:88svh;display:flex;align-items:flex-end;overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:heroDrift 26s ease-in-out infinite alternate}
.hero-veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(185deg,rgba(26,12,3,.3) 0%,rgba(26,12,3,.55) 55%,rgba(20,9,2,.92) 100%)}
.hero.has-img .hero-spoon{display:none}
.hero.has-img .hero-zh-mark{opacity:.55;z-index:1}
.hero-bg{position:absolute;inset:-6%;
  background:
    radial-gradient(120% 90% at 78% 18%,rgba(242,178,124,.20),transparent 55%),
    radial-gradient(90% 70% at 15% 85%,rgba(122,56,15,.85),transparent 60%),
    linear-gradient(160deg,#4A2410 0%,#351A08 45%,#241104 100%);
  animation:heroDrift 24s ease-in-out infinite alternate}
@keyframes heroDrift{from{transform:scale(1) translateY(0)}to{transform:scale(1.05) translateY(-1.5%)}}
.hero-zh-mark{position:absolute;right:-2%;top:6%;font-family:var(--serif-tc);font-weight:900;
  writing-mode:vertical-rl;font-size:clamp(7rem,22vmin,15rem);line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(242,178,124,.22);
  letter-spacing:.1em;user-select:none;pointer-events:none}
.hero-spoon{position:absolute;left:70%;top:40%;transform:translate(-50%,-50%) rotate(-30deg);
  width:min(26vmin,240px);opacity:.3;pointer-events:none}
.hero-spoon path{stroke:var(--gold);fill:none;stroke-width:1.4;
  stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.8s .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 3px),
  repeating-linear-gradient(90deg,transparent 0 2px,rgba(0,0,0,.02) 2px 3px)}
.hero-in{position:relative;z-index:2;width:100%;max-width:var(--wrap);margin:0 auto;
  padding:9rem var(--gutter-r) 4.5rem var(--gutter)}
.hero-eyebrow{display:flex;align-items:center;gap:.9rem;margin-bottom:1.4rem}
.hero-eyebrow .tick{width:34px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(2.6rem,7.2vw,5.4rem);max-width:12em}
.hero h1 .gold{color:var(--gold-soft);font-style:italic}
html[lang="zh-Hant"] .hero h1 .gold{font-style:normal}
.hero-sub{margin-top:1.5rem;font-size:clamp(.98rem,1.4vw,1.12rem);color:var(--mist);max-width:30em}
.hero-ctas{display:flex;gap:.9rem;margin-top:2.2rem;flex-wrap:wrap}
.hero-meta{display:flex;gap:2.2rem;flex-wrap:wrap;margin-top:3rem;padding-top:1.4rem;
  border-top:1px solid var(--line-dark);font-size:.78rem;color:var(--mist);letter-spacing:.08em}
.hero-meta b{display:block;color:var(--gold-soft);font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;font-size:.66rem;margin-bottom:.2rem}
html[lang="zh-Hant"] .hero-meta b{letter-spacing:.3em}
/* hero entrance */
.h-anim{opacity:0;transform:translateY(24px);animation:rise .9s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}
.d4{animation-delay:.7s}.d5{animation-delay:.9s}.d6{animation-delay:1.1s}
@media(prefers-reduced-motion:reduce){.h-anim{opacity:1;transform:none;animation:none}}
.scroll-hint{position:absolute;left:50%;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:3;color:var(--gold-soft);font-size:.62rem;
  letter-spacing:.34em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.scroll-hint::after{content:"";width:1px;height:34px;background:linear-gradient(var(--gold),transparent);
  animation:hint 2.2s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- section scaffolding ---------- */
.sec{padding:clamp(4.5rem,9vw,7.5rem) 0}
.sec-dark{background:var(--green);color:var(--ivory)}
.sec-deep{background:var(--green-3);color:var(--ivory)}
.sec-cream{background:var(--cream)}
.sec-head{max-width:40em;margin-bottom:clamp(2.2rem,5vw,3.6rem)}
.sec-head h2{font-size:clamp(1.9rem,4.2vw,3.1rem);margin:.7rem 0 1rem}
.sec-dark .lede,.sec-deep .lede{color:var(--mist)}
.sec-cream .lede,.sec-ivory .lede{color:var(--olive)}

/* ---------- photo plates (editable image slots) ---------- */
.plate{position:relative;overflow:hidden;border-radius:3px;background:var(--green-2)}
.plate img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.plate:hover img{transform:scale(1.045)}
.plate-art{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.7rem;text-align:center;
  padding:1.2rem;color:var(--gold-soft)}
.plate-art::before{content:"";position:absolute;inset:10px;border:1px solid var(--line-dark);border-radius:2px}
.plate-art::after{content:"";position:absolute;inset:0;
  background:radial-gradient(85% 70% at 50% 30%,rgba(242,178,124,.14),transparent 70%)}
.plate-art .glyph{font-family:var(--serif-tc);font-weight:700;font-size:2.1rem;line-height:1;
  color:var(--gold);position:relative;z-index:1}
.plate-art .pl-name{position:relative;z-index:1;font-family:var(--serif);font-size:1.02rem;color:var(--ivory)}
html[lang="zh-Hant"] .plate-art .pl-name{font-family:var(--serif-tc)}
.plate-art .pl-note{position:relative;z-index:1;font-size:.6rem;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(216,188,138,.6)}
html[lang="zh-Hant"] .plate-art .pl-note{letter-spacing:.3em}

/* ---------- story ---------- */
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.story-media{position:relative}
.story-media .plate{aspect-ratio:4/5}
.story-media::after{content:"";position:absolute;right:-14px;bottom:-14px;width:46%;height:46%;
  border:1px solid var(--line-dark);z-index:-1;border-radius:2px}
.story-cap{margin-top:.8rem;font-size:.72rem;letter-spacing:.14em;color:var(--mist);text-transform:uppercase}
html[lang="zh-Hant"] .story-cap{letter-spacing:.26em}
.story-txt p{margin-bottom:1.1rem;color:rgba(247,243,234,.82);max-width:33em}
.story-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem;
  border-top:1px solid var(--line-dark);padding-top:1.6rem}
.story-facts div b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--gold-soft);font-weight:600}
html[lang="zh-Hant"] .story-facts div b{font-family:var(--serif-tc)}
.story-facts div span{font-size:.72rem;letter-spacing:.1em;color:var(--mist)}

/* ---------- menu ---------- */
.menu-top{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2.4rem}
.filters button{padding:.5rem 1.05rem;font-size:.78rem;font-weight:600;letter-spacing:.1em;
  border:1px solid var(--line-light);border-radius:999px;color:var(--olive);
  transition:all .3s var(--ease)}
html[lang="zh-Hant"] .filters button{letter-spacing:.2em}
.filters button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ivory)}
.filters button:hover{border-color:var(--green)}
.sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-bottom:3.4rem}
.sig-card{background:#fff;border:1px solid var(--line-light);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:column}
.sig-card .plate{aspect-ratio:4/3;border-radius:0}
.sig-body{padding:1.3rem 1.3rem 1.5rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.sig-tag{font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
html[lang="zh-Hant"] .sig-tag{letter-spacing:.34em}
.sig-name{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.sig-name h3{font-family:var(--serif);font-size:1.3rem;font-weight:600}
html[lang="zh-Hant"] .sig-name h3{font-family:var(--serif-tc);font-size:1.18rem}
.price{font-family:var(--serif);font-size:1.05rem;color:var(--green);font-weight:700;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.sig-zh{font-size:.84rem;color:var(--olive);letter-spacing:.06em}
.sig-desc{font-size:.88rem;color:var(--olive);margin-top:.2rem}
.menu-list{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 3.5rem}
.mi{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:baseline;
  padding:.95rem 0;border-bottom:1px solid var(--line-light);
  transition:opacity .4s var(--ease),transform .4s var(--ease)}
.mi.hide{display:none}
.mi-names{min-width:0}
.mi-en{font-family:var(--serif);font-size:1.08rem;font-weight:600;color:var(--ink)}
html[lang="zh-Hant"] .mi-en{font-family:var(--serif-tc);font-size:1rem}
.mi-sub{font-size:.8rem;color:var(--olive);letter-spacing:.04em}
.mi-dots{align-self:center}
.mi-cat{grid-column:1/-1;margin:2.2rem 0 .4rem;display:flex;align-items:center;gap:1rem}
.mi-cat.hide{display:none}
.mi-cat h3{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700}
html[lang="zh-Hant"] .mi-cat h3{letter-spacing:.4em}
.mi-cat::after{content:"";flex:1;height:1px;background:var(--line-light)}
.menu-note{margin-top:2.6rem;font-size:.8rem;color:var(--olive);max-width:46em;
  border-left:2px solid var(--gold);padding-left:1rem}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:.9rem}
.gal .g{border:0;padding:0;text-align:inherit;cursor:pointer}
.gal .g:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal .g:nth-child(4){grid-row:span 2}
.gal .plate{width:100%;height:100%}
.gal-note{margin-top:1.6rem;font-size:.78rem;color:var(--mist);letter-spacing:.04em}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(26,13,4,.95);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.lb.open{opacity:1;visibility:visible}
.lb-stage{width:min(860px,88vw);max-height:80svh}
.lb-stage .plate{aspect-ratio:4/3}
.lb-cap{text-align:center;color:var(--gold-soft);font-size:.86rem;margin-top:1rem;letter-spacing:.08em}
.lb-btn{position:absolute;color:var(--ivory);font-size:1.5rem;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line-dark);border-radius:50%;
  transition:background .3s}
.lb-btn:hover{background:rgba(242,178,124,.18)}
.lb-x{top:calc(1rem + env(safe-area-inset-top,0px));right:calc(1rem + env(safe-area-inset-right,0px));font-size:1.1rem}
.lb-prev{left:calc(.6rem + env(safe-area-inset-left,0px))}
.lb-next{right:calc(.6rem + env(safe-area-inset-right,0px))}

/* ---------- instagram ---------- */
.ig-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.7rem;margin:2.4rem 0}
.ig-grid a .plate{aspect-ratio:1}
.ig-cta{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.ig-handle{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--gold-soft)}

/* ---------- halal ---------- */
.halal-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.halal-mark{border:1px solid var(--line-light);border-radius:3px;background:#fff;
  padding:2.2rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
.halal-mark .ring{width:92px;height:92px;border:1.5px solid var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif-tc);font-weight:700;font-size:1.5rem;color:var(--green);position:relative}
.halal-mark .ring::after{content:"";position:absolute;inset:6px;border:1px solid var(--line-light);border-radius:50%}
.halal-mark p{font-size:.82rem;color:var(--olive)}
.halal-txt p{margin-bottom:1rem;color:#3d4038;max-width:36em}
.halal-txt .fine{font-size:.82rem;color:var(--olive);border-left:2px solid var(--gold);padding-left:1rem}

/* ---------- visit ---------- */
.visit-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2.4rem,5vw,4.5rem)}
.vcard{border-top:1px solid var(--line-dark);padding:1.3rem 0;display:grid;
  grid-template-columns:120px 1fr;gap:1rem}
.vcard dt{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700;padding-top:.2rem}
html[lang="zh-Hant"] .vcard dt{letter-spacing:.34em}
.vcard dd{color:rgba(247,243,234,.88);font-size:.95rem}
.vcard dd .sub{display:block;font-size:.8rem;color:var(--mist);margin-top:.15rem}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:.32rem 0;font-size:.9rem;border-bottom:1px dashed rgba(242,178,124,.14)}
.hours td:last-child{text-align:right;color:var(--gold-soft)}
.hours tr.closedday td:last-child{color:var(--mist);font-style:italic}
.hours tr.today td{color:#fff;font-weight:600}
.hours tr.today td:first-child::after{content:" ·";color:var(--gold)}
.visit-actions{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:1.8rem}
.map-ph{position:relative;border:1px solid var(--line-dark);border-radius:3px;overflow:hidden;
  aspect-ratio:4/3;background:
    radial-gradient(60% 50% at 62% 40%,rgba(242,178,124,.16),transparent 70%),
    repeating-linear-gradient(0deg,transparent 0 46px,rgba(242,178,124,.07) 46px 47px),
    repeating-linear-gradient(90deg,transparent 0 46px,rgba(242,178,124,.07) 46px 47px),
    var(--green-2)}
.map-ph a{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
.map-pin{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:var(--gold);display:flex;align-items:center;justify-content:center;
  animation:pinFloat 3s ease-in-out infinite}
.map-pin::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--green-3)}
@keyframes pinFloat{0%,100%{transform:rotate(-45deg) translate(0)}50%{transform:rotate(-45deg) translate(-4px,4px)}}
.map-ph .map-lab{color:var(--gold-soft);font-size:.74rem;letter-spacing:.26em;text-transform:uppercase}
.map-ph .map-plus{color:var(--mist);font-size:.78rem;letter-spacing:.1em}

/* ---------- footer ---------- */
footer{background:var(--green-3);color:var(--mist);
  padding:4rem 0 calc(7rem + env(safe-area-inset-bottom,0px))}
@media(min-width:861px){footer{padding-bottom:3rem}}
.f-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:2.5rem;
  padding-bottom:2.5rem;border-bottom:1px solid rgba(242,178,124,.14)}
.f-brand .brand-name{font-size:1.25rem;color:var(--ivory)}
.f-tag{font-size:.86rem;max-width:26em;margin-top:.9rem}
.f-h{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:1rem}
html[lang="zh-Hant"] .f-h{letter-spacing:.4em}
.f-grid a{display:block;padding:.3rem 0;font-size:.88rem;color:rgba(247,243,234,.75)}
.f-grid a:hover{color:var(--gold-soft)}
.f-base{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding-top:1.6rem;font-size:.74rem;color:rgba(230,198,168,.8)}

/* ---------- mobile action bar ---------- */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:48;display:none;
  background:rgba(53,26,8,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line-dark);
  padding:.45rem var(--gutter-r) calc(.45rem + env(safe-area-inset-bottom,0px)) var(--gutter)}
.mbar-in{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem}
.mbar a{display:flex;flex-direction:column;align-items:center;gap:.18rem;
  padding:.4rem .2rem;color:var(--gold-soft);font-size:.64rem;letter-spacing:.16em;border-radius:3px}
html[lang="zh-Hant"] .mbar a{letter-spacing:.24em}
.mbar a:active{background:rgba(242,178,124,.14)}
.mbar svg{width:19px;height:19px;stroke:var(--gold-soft)}

/* ---------- cinematic image motion ---------- */
.plate .curtain{position:absolute;inset:0;z-index:3;background:var(--green-3);
  transform:scaleY(0);transform-origin:top;transition:transform 1s var(--ease);pointer-events:none}
.plate.irv-pre .curtain{transform:scaleY(1)}
.plate.irv-pre img{transform:scale(1.14)}
.sig-card{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.sig-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(70,34,10,.16)}
.lb-stage{transform:scale(.94);opacity:0;transition:transform .45s var(--ease),opacity .45s var(--ease)}
.lb.open .lb-stage{transform:none;opacity:1}
.story-mini{position:absolute;right:-12px;bottom:-28px;width:46%;aspect-ratio:4/3;object-fit:cover;
  border:5px solid var(--ivory);border-radius:3px;box-shadow:0 16px 36px rgba(0,0,0,.35);z-index:2}

/* ---------- atmosphere band ---------- */
.atmo{position:relative;overflow:hidden;min-height:58vh;display:flex;align-items:center;
  justify-content:center;text-align:center;background:var(--green-3)}
.atmo>img{position:absolute;left:0;right:0;top:-12%;width:100%;height:124%;object-fit:cover}
.atmo::after{content:"";position:absolute;inset:0;background:rgba(26,13,4,.56)}
.atmo-in{position:relative;z-index:2;max-width:46em;
  padding:5.5rem var(--gutter-r) 5.5rem var(--gutter)}
.atmo-in .eyebrow{display:block;margin-bottom:1.1rem}
.atmo-in h2{color:#fff;font-size:clamp(1.7rem,4vw,2.9rem);text-shadow:0 2px 24px rgba(0,0,0,.4)}

/* ---------- responsive ---------- */
@media(max-width:1020px){
  .sig-grid{grid-template-columns:1fr 1fr}
  .ig-grid{grid-template-columns:repeat(3,1fr)}
  .gal{grid-template-columns:repeat(3,1fr)}
  .gal .g:nth-child(4){grid-row:span 1}
}
@media(max-width:860px){
  .nav-links,.nav .nav-cta{display:none}

  .story-facts{grid-template-columns:repeat(3,1fr);gap:.6rem}
  .vcard{grid-template-columns:96px 1fr}
}
@media(max-width:380px){

  .btn{width:100%}
  .hero-ctas{flex-direction:column}
}

/* ---------- image slot helper ---------- */
function plateHTML(src,glyph,nameEn,nameZh,showNote){
  const t=I18N[lang], name=lang==="en"?nameEn:nameZh;
  if(src){return `<figure class="plate"><img src="${src}" alt="${name}" loading="lazy"></figure>`;}
  return `<figure class="plate"><div class="plate-art">
    <span class="glyph" aria-hidden="true">${glyph}</span>
    <span class="pl-name">${name}</span>
    ${showNote?`<span class="pl-note">${t["ph.note"]}</span>`:""}
  </div></figure>`;
}

/* ---------- builders ---------- */
function buildSig(){
  const t=I18N[lang];
  $("#sigGrid").innerHTML=SIGNATURE.map(s=>`
    <article class="sig-card rv">
      ${plateHTML(CONFIG.images.sig[s.img],s.glyph,s.en,s.zh,false)}
      <div class="sig-body">
        <span class="sig-tag">${t["sig.tag"]}</span>
        <div class="sig-name"><h3>${lang==="en"?s.en:s.zh}</h3><span class="price">NT$${s.price}</span></div>
        <span class="sig-zh">${lang==="en"?s.zh:s.en}</span>
        <p class="sig-desc">${lang==="en"?s.descEn:s.descZh}</p>
      </div>
    </article>`).join("");
}

    html+=`<div class="mi-cat" data-cat="${cat}"><h3>${t["cat."+cat]}</h3></div>`;
    html+=MENU.filter(m=>m.cat===cat).map(m=>`
      <div class="mi" data-cat="${m.cat}">
        <div class="mi-names"><div class="mi-en">${lang==="en"?m.en:m.zh}</div>
        <div class="mi-sub">${lang==="en"?m.zh:m.en}</div></div>
        <span class="price">NT$${m.price}</span>
      </div>`).join("");
  });
  $("#menuList").innerHTML=html;
  applyFilter();
}
function applyFilter(){
  $$("#menuList .mi").forEach(el=>el.classList.toggle("hide",activeCat!=="all"&&el.dataset.cat!==activeCat));
  $$("#menuList .mi-cat").forEach(el=>el.classList.toggle("hide",activeCat!=="all"&&el.dataset.cat!==activeCat));
}
function buildGallery(){
  $("#galGrid").innerHTML=GALLERY.map((g,i)=>`
    <button class="g" data-idx="${i}" aria-label="${lang==="en"?g.en:g.zh}">
      ${plateHTML(CONFIG.images.gallery[g.key],g.glyph,g.en,g.zh,true)}
    </button>`).join("");
  $$("#galGrid .g").forEach(b=>b.addEventListener("click",()=>openLB(+b.dataset.idx)));
}
function buildIG(){
  $("#igGrid").innerHTML=CONFIG.images.ig.map((src,i)=>`
    <a href="${CONFIG.instagram}" target="_blank" rel="noopener" aria-label="Instagram — @thegoldenspoon_halal">
      ${plateHTML(src,"✦","@thegoldenspoon_halal","@thegoldenspoon_halal",false)}
    </a>`).join("");
}
function buildHours(){
  const t=I18N[lang];
  /* order rows Mon-first for zh/Taiwan convention? Keep Tue→Mon? Use Mon..Sun */
  const order=[1,2,3,4,5,6,0];
  const now=new Date();
  let today;
  try{ today=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short"}).format(now); }catch(e){ today=""; }
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const ti=map[today];
  $("#hoursTbl").innerHTML=order.map(d=>{
    const h=CONFIG.hours[d];
    return `<tr class="${h?"":"closedday"} ${d===ti?"today":""}">
      <td>${t.days[d]}</td><td>${h?t.hoursFmt(h[0],h[1]):t.closed}</td></tr>`;
  }).join("");
}

/* ---------- language ---------- */
function applyLang(next){
  lang=next;
  try{localStorage.setItem("gs-lang",lang);}catch(e){}
  document.documentElement.lang = lang==="en"?"en":"zh-Hant";
  const t=I18N[lang];
  $$("[data-i18n]").forEach(el=>{const k=el.dataset.i18n; if(t[k]!==undefined) el.textContent=t[k];});
  [["langEN","langZH"],["langEN2","langZH2"]].forEach(([e,z])=>{
    $("#"+e).setAttribute("aria-pressed",lang==="en"?"true":"false");
    $("#"+z).setAttribute("aria-pressed",lang==="zh"?"true":"false");
  });
  buildSig();buildFilters();buildMenu();buildGallery();buildIG();buildHours();
  markReveals(true);decorateImages();
}
["langEN","langEN2"].forEach(id=>$("#"+id).addEventListener("click",()=>applyLang("en")));
["langZH","langZH2"].forEach(id=>$("#"+id).addEventListener("click",()=>applyLang("zh")));

/* ---------- announcement ---------- */
if(CONFIG.announcementOn){
  let dism=false; try{dism=sessionStorage.getItem("gs-annc")==="1";}catch(e){}
  if(!dism){$("#annc").hidden=false;}
  $("#anncX").addEventListener("click",()=>{$("#annc").hidden=true;try{sessionStorage.setItem("gs-annc","1");}catch(e){}});
}

/* ---------- nav ---------- */
const nav=$("#nav"), burger=$("#burger"), mnav=$("#mnav");
function onScroll(){nav.classList.toggle("solid",window.scrollY>30);}
onScroll();window.addEventListener("scroll",onScroll,{passive:true});
function closeMnav(){burger.setAttribute("aria-expanded","false");mnav.classList.remove("open");document.body.style.overflow="";}
burger.addEventListener("click",()=>{
  const open=burger.getAttribute("aria-expanded")==="true";
  if(open){closeMnav();}else{burger.setAttribute("aria-expanded","true");mnav.classList.add("open");document.body.style.overflow="hidden";}
});
$$("#mnav a").forEach(a=>a.addEventListener("click",closeMnav));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMnav();closeLB();}});

/* ---------- reveal on scroll ---------- */
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let io=null;
function markReveals(rebuilt){
  if(reduce){$$(".rv,.mask").forEach(el=>el.classList.add("in"));return;}
  if(!io){io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{threshold:.12,rootMargin:"0px 0px -4% 0px"});}
  $$(".rv:not(.in)").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<window.innerHeight*.96){el.classList.add("in");}
    else{el.classList.add("pre");io.observe(el);}
  });
}
markReveals(false);

/* ---------- masked image reveals with stagger ---------- */
const irvIO = reduce ? null : new IntersectionObserver(es=>{es.forEach(en=>{
  if(en.isIntersecting){en.target.classList.remove("irv-pre");irvIO.unobserve(en.target);}
});},{threshold:.15,rootMargin:"0px 0px -4% 0px"});
function decorateImages(){
  if(reduce)return;
  $$(".plate").forEach(p=>{
    if(p.closest(".hero")||p.closest(".lb"))return;
    if(!p.querySelector(".curtain")){
      const c=document.createElement("span");c.className="curtain";c.setAttribute("aria-hidden","true");p.appendChild(c);
    }
    if(!p.dataset.irv){
      p.dataset.irv="1";
      const r=p.getBoundingClientRect();
      if(r.top>=window.innerHeight*.96){p.classList.add("irv-pre");irvIO.observe(p);}
    }
  });
  [["#sigGrid .plate",.12],["#galGrid .plate",.09],["#igGrid .plate",.07]].forEach(([sel,step])=>{
    $$(sel).forEach((p,i)=>{
      const c=p.querySelector(".curtain");
      if(c){c.style.transitionDelay=(0.08+(i%6)*step)+"s";}
    });
  });
}

/* ---------- gentle parallax (desktop, motion allowed) ---------- */
if(matchMedia("(min-width:861px)").matches && !reduce){
  const aim=$("#atmoImg");let ticking=false;
  function plx(){ticking=false;if(!aim)return;
    const r=aim.parentElement.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight)return;
    const off=(r.top+r.height/2-innerHeight/2)*0.1;
    aim.style.transform="translateY("+off.toFixed(1)+"px)";}
  addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(plx);}},{passive:true});
  plx();
}

/* ---------- lightbox ---------- */
const lb=$("#lb");let lbi=0;
function renderLB(){
  const g=GALLERY[lbi];
  $("#lbPlate").innerHTML=plateHTML(CONFIG.images.gallery[g.key],g.glyph,g.en,g.zh,true);
  $("#lbCap").textContent=(lang==="en"?g.en:g.zh)+"  ·  "+(lbi+1)+" / "+GALLERY.length;
}
function openLB(i){lbi=i;renderLB();lb.hidden=false;requestAnimationFrame(()=>lb.classList.add("open"));document.body.style.overflow="hidden";$("#lbX").focus();}
function closeLB(){if(lb.hidden)return;lb.classList.remove("open");document.body.style.overflow="";setTimeout(()=>lb.hidden=true,350);}
function stepLB(d){lbi=(lbi+d+GALLERY.length)%GALLERY.length;renderLB();}
$("#lbX").addEventListener("click",closeLB);
$("#lbPrev").addEventListener("click",()=>stepLB(-1));
$("#lbNext").addEventListener("click",()=>stepLB(1));
lb.addEventListener("click",e=>{if(e.target===lb)closeLB();});
document.addEventListener("keydown",e=>{if(lb.hidden)return;
  if(e.key==="ArrowLeft")stepLB(-1); if(e.key==="ArrowRight")stepLB(1);});
let tx=null;
lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)stepLB(dx<0?1:-1);tx=null;},{passive:true});

/* ---------- smooth anchor offset (fixed nav) ---------- */
$$("[data-navlink]").forEach(a=>{
  a.addEventListener("click",e=>{
    const href=a.getAttribute("href");
    if(href&&href.startsWith("#")){
      const el=document.querySelector(href);
      if(el){e.preventDefault();
        const y=el.getBoundingClientRect().top+window.scrollY-64;
        window.scrollTo({top:y,behavior:reduce?"auto":"smooth"});}
    }
  });
});

/* init */
applyLang(lang);
})();
</script>
</body>
</html>
